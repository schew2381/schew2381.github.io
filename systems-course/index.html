<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#152a3a">
    <meta
      name="description"
      content="An interactive course that connects Linux, virtualization, storage, networking, and Kubernetes scheduling."
    >
    <meta property="og:title" content="Below the Pod">
    <meta
      property="og:description"
      content="Build the systems model beneath Kubernetes through simulations, quizzes, and code labs."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://schew2381.github.io/systems-course/">
    <title>Below the Pod | Systems crash course</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css?v=20260715">
  </head>
  <body>
    <a class="skip-link" href="#course-view">Skip to the lesson</a>

    <div class="course-shell" id="app">
      <aside class="course-rail" aria-label="Course navigation">
        <button class="brand-lockup" type="button" data-route="home" aria-label="Below the Pod home">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="brand-copy">
            <strong>Below the Pod</strong>
            <small>Systems workbench</small>
          </span>
        </button>
        <button class="mobile-map-close" id="mobile-map-close" type="button" aria-label="Close course map">×</button>

        <section class="rail-progress" aria-labelledby="progress-label">
          <div class="progress-copy">
            <span id="progress-label">Course progress</span>
            <strong id="progress-percent">0%</strong>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-labelledby="progress-label"
          >
            <span id="progress-bar"></span>
          </div>
          <p id="progress-detail">Start with the systems trace.</p>
        </section>

        <nav class="module-nav" id="module-nav" aria-label="Course modules"></nav>

        <div class="rail-tools">
          <label class="depth-control" for="depth-select">
            <span>Explanation depth</span>
            <select id="depth-select">
              <option value="core">Core model</option>
              <option value="kernel">Kernel view</option>
              <option value="code">Code view</option>
            </select>
          </label>
          <button class="quiet-button" id="reset-progress" type="button">Reset progress</button>
        </div>
      </aside>

      <div class="course-stage">
        <header class="course-topbar">
          <div class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></div>
          <div class="topbar-actions">
            <button class="search-trigger" id="search-trigger" type="button" aria-haspopup="dialog" aria-label="Search course">
              <span aria-hidden="true">⌕</span>
              <span>Search course</span>
              <kbd>⌘ K</kbd>
            </button>
            <button class="mobile-map-trigger" id="mobile-map-trigger" type="button" aria-expanded="false">
              Course map
            </button>
          </div>
        </header>

        <main id="course-view" tabindex="-1"></main>
      </div>

      <aside class="context-drawer" id="context-drawer" aria-label="Lesson context"></aside>
    </div>

    <dialog class="search-dialog" id="search-dialog" aria-labelledby="search-title">
      <div class="search-dialog-head">
        <div>
          <span class="eyebrow">Quick switcher</span>
          <h2 id="search-title">Find a concept</h2>
        </div>
        <button class="icon-button" id="search-close" type="button" aria-label="Close search">×</button>
      </div>
      <label class="search-field" for="search-input">
        <span aria-hidden="true">⌕</span>
        <input
          id="search-input"
          type="search"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="search-results"
          aria-expanded="false"
          aria-label="Search course concepts"
          placeholder="Try cgroups, virtio, or noisy neighbor"
          autocomplete="off"
        >
      </label>
      <div class="search-results" id="search-results" role="listbox"></div>
      <p class="search-help"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>Enter</kbd> open <kbd>Esc</kbd> close</p>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sr-only" id="live-region" aria-live="polite"></div>

    <script src="course-data.js?v=20260715" defer></script>
    <script src="course-modernization.js?v=20260715" defer></script>
    <script src="app.js?v=20260715" defer></script>
  </body>
</html>
